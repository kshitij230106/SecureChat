</div>

<script>

    // ==========================================
    // SOCKET.IO
    // ==========================================

    const socket = io();


    // ==========================================
    // VARIABLES
    // ==========================================

    let currentMode = "login";


    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const authForm =
        document.getElementById("authForm");

    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const submitBtn =
        document.getElementById("submitBtn");

    const messageBox =
        document.getElementById("message");

    const loginTab =
        document.getElementById("loginTab");

    const registerTab =
        document.getElementById("registerTab");

    const statusDot =
        document.getElementById("statusDot");

    const connectionText =
        document.getElementById("connectionText");


    // ==========================================
    // SHOW LOGIN
    // ==========================================

    function showLogin() {

        currentMode = "login";

        loginTab.classList.add("active");

        registerTab.classList.remove("active");

        submitBtn.textContent = "Login";

        usernameInput.value = "";

        passwordInput.value = "";

        clearMessage();
    }


    // ==========================================
    // SHOW REGISTER
    // ==========================================

    function showRegister() {

        currentMode = "register";

        registerTab.classList.add("active");

        loginTab.classList.remove("active");

        submitBtn.textContent = "Create Account";

        usernameInput.value = "";

        passwordInput.value = "";

        clearMessage();
    }


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, type) {

        messageBox.textContent = text;

        messageBox.className =
            "message " + type;
    }


    // ==========================================
    // CLEAR MESSAGE
    // ==========================================

    function clearMessage() {

        messageBox.textContent = "";

        messageBox.className =
            "message";
    }


    // ==========================================
    // SOCKET CONNECTED
    // ==========================================

    socket.on("connect", function() {

        statusDot.classList.add("connected");

        connectionText.textContent =
            "Connected to server";

    });


    // ==========================================
    // SOCKET DISCONNECTED
    // ==========================================

    socket.on("disconnect", function() {

        statusDot.classList.remove("connected");

        connectionText.textContent =
            "Disconnected from server";

    });


    // ==========================================
    // LOGIN / REGISTER FORM
    // ==========================================

    authForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value;

            if (!username) {

                showMessage(
                    "Please enter a username.",
                    "error"
                );

                return;
            }

            if (!password) {

                showMessage(
                    "Please enter a password.",
                    "error"
                );

                return;
            }


            submitBtn.disabled = true;

            submitBtn.textContent =
                currentMode === "login"
                    ? "Logging in..."
                    : "Creating account...";


            clearMessage();


            const data = {

                username: username,

                password: password

            };


            if (currentMode === "login") {

                socket.emit(
                    "login",
                    data
                );

            } else {

                socket.emit(
                    "register",
                    data
                );

            }

        }
    );


    // ==========================================
    // LOGIN SUCCESS
    // ==========================================

    socket.on(
        "login_success",
        function(data) {

            showMessage(
                data.message ||
                "Login successful!",
                "success"
            );

            sessionStorage.setItem(
                "username",
                data.username
            );

            setTimeout(
                function() {

                    window.location.href =
                        "/chat";

                },
                500
            );

        }
    );


    // ==========================================
    // LOGIN ERROR
    // ==========================================

    socket.on(
        "login_error",
        function(data) {

            showMessage(
                data.message ||
                "Login failed.",
                "error"
            );

            submitBtn.disabled = false;

            submitBtn.textContent =
                "Login";

        }
    );


    // ==========================================
    // REGISTER SUCCESS
    // ==========================================

    socket.on(
        "register_success",
        function(data) {

            showMessage(
                data.message ||
                "Registration successful! You can now login.",
                "success"
            );

            submitBtn.disabled = false;

            showLogin();

            usernameInput.value = "";

            passwordInput.value = "";

        }
    );


    // ==========================================
    // REGISTER ERROR
    // ==========================================

    socket.on(
        "register_error",
        function(data) {

            showMessage(
                data.message ||
                "Registration failed.",
                "error"
            );

            submitBtn.disabled = false;

            submitBtn.textContent =
                "Create Account";

        }
    );

</script>

</body>
