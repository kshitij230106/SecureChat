<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 280px;
            background: #111827;
            border-right: 1px solid #273449;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #273449;
        }

        .sidebar-header h2 {
            color: #38bdf8;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .section-title {
            padding: 15px 20px 8px;
            color: #64748b;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .users {
            overflow-y: auto;
            flex: 1;
        }

        .user {
            padding: 13px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .user:hover {
            background: #1e293b;
        }

        .user.active {
            background: #1e3a5f;
        }

        .status {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
        }

        .user-name {
            font-size: 15px;
        }

        /* GROUPS */

        .groups {
            max-height: 200px;
            overflow-y: auto;
        }

        .group {
            padding: 10px 20px;
            cursor: pointer;
            color: #cbd5e1;
        }

        .group:hover {
            background: #1e293b;
        }

        /* MAIN CHAT */

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            height: 70px;
            background: #111827;
            border-bottom: 1px solid #273449;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .chat-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-user h3 {
            font-size: 17px;
        }

        .chat-user span {
            color: #22c55e;
            font-size: 12px;
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .logout:hover {
            background: #dc2626;
        }

        /* MESSAGES */

        .messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty {
            margin: auto;
            text-align: center;
            color: #64748b;
        }

        .empty h2 {
            margin-bottom: 8px;
        }

        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .message.sent {
            align-self: flex-end;
            background: #0284c7;
            border-bottom-right-radius: 2px;
        }

        .message.received {
            align-self: flex-start;
            background: #1e293b;
            border-bottom-left-radius: 2px;
        }

        .message-user {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .message-text {
            font-size: 15px;
        }

        /* INPUT */

        .input-area {
            padding: 15px 20px;
            background: #111827;
            border-top: 1px solid #273449;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 13px;
            border-radius: 7px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #38bdf8;
        }

        .send-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn:hover {
            background: #0369a1;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            .sidebar {
                width: 210px;
            }

            .message {
                max-width: 80%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="sidebar-header">
            <h2>SecureChat</h2>
            <p id="loggedUser">Connecting...</p>
        </div>

        <div class="section-title">
            Online Users
        </div>

        <div class="users" id="usersList">
            <div class="empty">
                Loading users...
            </div>
        </div>

        <div class="section-title">
            Groups
        </div>

        <div class="groups" id="groupsList">
        </div>

    </div>


    <!-- CHAT -->

    <div class="chat">

        <div class="chat-header">

            <div class="chat-user">
                <div>
                    <h3 id="chatTitle">Select a user</h3>
                    <span id="chatStatus"></span>
                </div>
            </div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>


        <div class="messages" id="messages">

            <div class="empty" id="emptyMessage">
                <h2>Welcome to SecureChat</h2>
                <p>Select a user to start chatting.</p>
            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Select a user first..."
                autocomplete="off"
                disabled
            >

            <button
                class="send-btn"
                id="sendButton"
                onclick="sendMessage()"
                disabled
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>

    // =========================
    // SOCKET CONNECTION
    // =========================

    const socket = io();

    const currentUsername = sessionStorage.getItem("username");

    let selectedUser = null;

    console.log("Current user:", currentUsername);


    // =========================
    // LOGIN CHECK
    // =========================

    if (!currentUsername) {

        window.location.href = "/";

    } else {

        document.getElementById("loggedUser").textContent =
            "Logged in as " + currentUsername;

    }


    // =========================
    // SOCKET CONNECT
    // =========================

    socket.on("connect", function() {

        console.log("Connected to web server");

        console.log("Socket ID:", socket.id);

        /*
         * IMPORTANT:
         * The login happened on index.html.
         *
         * When index.html redirects to chat.html,
         * this page gets a new Socket.IO connection.
         *
         * So we attach this browser connection
         * to the existing TCP connection.
         */

        socket.emit("attach", {
            username: currentUsername
        });

    });


    // =========================
    // ATTACH SUCCESS
    // =========================

    socket.on("attach_success", function(data) {

        console.log(
            "Attached successfully:",
            data.username
        );

        socket.emit("get_users");

        socket.emit("get_groups");

    });


    // =========================
    // ATTACH ERROR
    // =========================

    socket.on("attach_error", function(data) {

        console.error(
            "Attach failed:",
            data.message
        );

        alert(
            "Connection error: " +
            data.message
        );

        sessionStorage.removeItem("username");

        window.location.href = "/";

    });


    // =========================
    // USERS LIST
    // =========================

    socket.on("users", function(data) {

        console.log("Users received:", data);

        const usersList =
            document.getElementById("usersList");

        usersList.innerHTML = "";

        let users = data.users || data;

        if (typeof users === "string") {

            users = users
                .split("|")
                .filter(Boolean);

        }

        if (!Array.isArray(users)) {

            console.error(
                "Invalid users data:",
                users
            );

            return;

        }


        users.forEach(function(username) {

            if (!username) {
                return;
            }

            /*
             * Don't display yourself
             */

            if (username === currentUsername) {
                return;
            }


            const userDiv =
                document.createElement("div");

            userDiv.className = "user";

            userDiv.dataset.username = username;

            userDiv.innerHTML = `
                <div class="status"></div>
                <div class="user-name">
                    ${escapeHtml(username)}
                </div>
            `;


            userDiv.onclick = function() {

                selectUser(username);

            };


            usersList.appendChild(userDiv);

        });


        if (usersList.children.length === 0) {

            usersList.innerHTML = `
                <div style="
                    padding:20px;
                    color:#64748b;
                    text-align:center;
                ">
                    No other users online
                </div>
            `;

        }

    });


    // =========================
    // GROUP LIST
    // =========================

    socket.on("groups", function(data) {

        console.log("Groups received:", data);

        const groupsList =
            document.getElementById("groupsList");

        groupsList.innerHTML = "";

        let groups = data.groups || data;

        if (typeof groups === "string") {

            groups = groups
                .split("|")
                .filter(Boolean);

        }

        if (!Array.isArray(groups)) {
            return;
        }


        groups.forEach(function(groupName) {

            const groupDiv =
                document.createElement("div");

            groupDiv.className = "group";

            groupDiv.textContent =
                "👥 " + groupName;

            groupDiv.onclick = function() {

                selectGroup(groupName);

            };

            groupsList.appendChild(groupDiv);

        });

    });


    // =========================
    // SELECT USER
    // =========================

    function selectUser(username) {

        selectedUser = username;

        console.log(
            "Selected user:",
            username
        );


        document.getElementById("chatTitle")
            .textContent = username;

        document.getElementById("chatStatus")
            .textContent = "Online";


        document.getElementById("messageInput")
            .disabled = false;

        document.getElementById("sendButton")
            .disabled = false;

        document.getElementById("messageInput")
            .placeholder =
            "Message " + username + "...";


        /*
         * Remove active class
         */

        document
            .querySelectorAll(".user")
            .forEach(function(element) {

                element.classList.remove("active");

            });


        /*
         * Highlight selected user
         */

        const selected =
            document.querySelector(
                `.user[data-username="${CSS.escape(username)}"]`
            );

        if (selected) {

            selected.classList.add("active");

        }


        /*
         * Clear messages
         */

        document.getElementById("messages")
            .innerHTML = "";


        /*
         * Request chat history
         */

        socket.emit("get_history", {

            username: username

        });

    }


    // =========================
    // HISTORY
    // =========================

    socket.on("history", function(data) {

        console.log(
            "History received:",
            data
        );


        const messages =
            document.getElementById("messages");

        messages.innerHTML = "";


        let history =
            data.history || data.messages || data;


        if (!Array.isArray(history)) {

            console.log(
                "History is not an array:",
                history
            );

            return;

        }


        history.forEach(function(message) {

            let sender =
                message.sender ||
                message.from ||
                "";

            let text =
                message.message ||
                message.text ||
                "";


            addMessage(
                sender,
                text,
                sender === currentUsername
            );

        });

    });


    // =========================
    // RECEIVE MESSAGE
    // =========================

    socket.on("message", function(data) {

        console.log(
            "Message received:",
            data
        );


        const sender =
            data.sender || data.from;

        const message =
            data.message || data.text || "";


        /*
         * If we're currently chatting with
         * this sender, display it.
         */

        if (
            selectedUser === sender ||
            sender === currentUsername
        ) {

            addMessage(
                sender,
                message,
                sender === currentUsername
            );

        }

    });


    // =========================
    // SEND MESSAGE
    // =========================

    function sendMessage() {

        const input =
            document.getElementById("messageInput");

        const message =
            input.value.trim();


        if (!selectedUser) {

            alert("Please select a user first.");

            return;

        }


        if (!message) {
            return;
        }


        console.log(
            "Sending message to:",
            selectedUser
        );


        socket.emit("chat_message", {

            username: currentUsername,

            receiver: selectedUser,

            message: message

        });


        /*
         * Display our own message immediately.
         */

        addMessage(
            currentUsername,
            message,
            true
        );


        input.value = "";

        input.focus();

    }


    // =========================
    // ENTER TO SEND
    // =========================

    document
        .getElementById("messageInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


    // =========================
    // ADD MESSAGE
    // =========================

    function addMessage(
        sender,
        text,
        isSent
    ) {

        const messages =
            document.getElementById("messages");


        /*
         * Remove welcome message
         */

        const empty =
            document.getElementById("emptyMessage");

        if (empty) {
            empty.remove();
        }


        const messageDiv =
            document.createElement("div");

        messageDiv.className =
            "message " +
            (isSent ? "sent" : "received");


        messageDiv.innerHTML = `

            <div class="message-user">
                ${escapeHtml(sender)}
            </div>

            <div class="message-text">
                ${escapeHtml(text)}
            </div>

        `;


        messages.appendChild(messageDiv);


        messages.scrollTop =
            messages.scrollHeight;

    }


    // =========================
    // GROUP SELECT
    // =========================

    function selectGroup(groupName) {

        console.log(
            "Selected group:",
            groupName
        );


        selectedUser = null;


        document.getElementById("chatTitle")
            .textContent =
            "#" + groupName;


        document.getElementById("chatStatus")
            .textContent =
            "Group";


        document.getElementById("messageInput")
            .disabled = false;


        document.getElementById("sendButton")
            .disabled = false;


        document.getElementById("messageInput")
            .placeholder =
            "Message #" + groupName + "...";


        document.getElementById("messages")
            .innerHTML = "";


        socket.emit(
            "get_group_history",
            {
                groupname: groupName
            }
        );

    }


    // =========================
    // GROUP HISTORY
    // =========================

    socket.on(
        "group_history",
        function(data) {

            console.log(
                "Group history:",
                data
            );


            const messages =
                document.getElementById("messages");

            messages.innerHTML = "";


            let history =
                data.history ||
                data.messages ||
                data;


            if (!Array.isArray(history)) {
                return;
            }


            history.forEach(function(message) {

                const sender =
                    message.sender ||
                    message.from ||
                    "";

                const text =
                    message.message ||
                    message.text ||
                    "";


                addMessage(
                    sender,
                    text,
                    sender === currentUsername
                );

            });

        }
    );


    // =========================
    // SERVER ERROR
    // =========================

    socket.on("error", function(data) {

        console.error(
            "Server error:",
            data
        );

    });


    // =========================
    // STATUS
    // =========================

    socket.on("status", function(data) {

        console.log(
            "Status:",
            data
        );

    });


    // =========================
    // LOGOUT
    // =========================

    function logout() {

        if (
            !confirm(
                "Are you sure you want to logout?"
            )
        ) {

            return;

        }


        /*
         * Tell server to close the TCP chat
         * connection.
         */

        socket.emit("logout");


        sessionStorage.removeItem(
            "username"
        );


        socket.disconnect();


        window.location.href = "/";

    }


    // =========================
    // ESCAPE HTML
    // =========================

    function escapeHtml(value) {

        const div =
            document.createElement("div");

        div.textContent =
            String(value);

        return div.innerHTML;

    }


    // =========================
    // PERIODIC USER REFRESH
    // =========================



    // =========================
    // DEBUG CONNECTION
    // =========================

    socket.on("disconnect", function(reason) {

        console.log(
            "Socket disconnected:",
            reason
        );

    });


</script>

</body>
</html>
